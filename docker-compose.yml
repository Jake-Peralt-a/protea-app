services:
  db:
    image: postgres:16-alpine
    container_name: protea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: protea
      POSTGRES_PASSWORD: protea
      POSTGRES_DB: protea
    ports:
      - "5433:5432"
    volumes:
      - protea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protea -d protea"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: protea-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://protea:protea@db:5432/protea?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -hex 32)}"
      APP_URL: "http://localhost:3000"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_DIR: ".storage"
      MAX_UPLOAD_BYTES: "10485760"
      ALLOWED_UPLOAD_TYPES: "image/png,image/jpeg,image/webp,application/pdf"
      DOCUMENT_RETENTION_DAYS: "365"
      EMAIL_DRIVER: "log"
      EMAIL_FROM: "no-reply@futureprotea.example"
    volumes:
      - protea-storage:/app/.storage

volumes:
  protea-db-data:
  protea-storage:
